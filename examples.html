<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHOTO LAB — References</title>

<style>
body {
    background: #111;
    color: #f4f1eb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 40px 20px;
}

.container {
    max-width: 1400px;
    margin: auto;
}

h1 {
    font-family: Georgia, serif;
    font-weight: normal;
    font-size: 42px;
    margin-bottom: 40px;
}

.images {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.card {
    background: #191919;
    border-radius: 18px;
    padding: 15px;
}

.card h2 {
    font-size: 11px;
    letter-spacing: 2px;
    color: #888;
    margin: 5px 0 15px;
}

.card img {
    width: 100%;
    display: block;
    border-radius: 12px;
}

@media (max-width: 700px) {
    .images {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>CAFÉ · ДО / ПОСЛЕ</h1>

<div class="images">

<div class="card">
<h2>ДО</h2>
<img src="examples/cafe-before.jpg">
</div>

<div class="card">
<h2>ПОСЛЕ</h2>
<img src="examples/cafe-after.jpg">
</div>

</div>

</div>

</body>
</html>
